<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F15BB5"/>
      <stop offset="50%" style="stop-color:#00BBF9"/>
      <stop offset="100%" style="stop-color:#9B5DE5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="300" height="200" fill="#0a0a0b"/>
  
  <!-- Neon grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#9B5DE5" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="300" height="200" fill="url(#grid)"/>
  
  <!-- Neon orbs -->
  <circle cx="100" cy="80" r="8" fill="#F15BB5" filter="url(#glow)" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="6" fill="#00BBF9" filter="url(#glow)" opacity="0.9">
    <animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="60" r="10" fill="#9B5DE5" filter="url(#glow)" opacity="0.7">
    <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central title -->
  <text x="150" y="110" text-anchor="middle" fill="white" font-family="Montserrat, sans-serif" font-size="28" font-weight="bold" filter="url(#glow)">NEON</text>
  <text x="150" y="135" text-anchor="middle" fill="#F15BB5" font-family="Montserrat, sans-serif" font-size="28" font-weight="bold" filter="url(#glow)">DREAMS</text>
  <text x="150" y="155" text-anchor="middle" fill="#00BBF9" font-family="Montserrat, sans-serif" font-size="12" font-weight="600">EDM / LOFI FUSION</text>
  
  <!-- Neon lines -->
  <line x1="50" y1="170" x2="250" y2="170" stroke="url(#neon-gradient)" stroke-width="3" filter="url(#glow)"/>
  <line x1="80" y1="180" x2="220" y2="180" stroke="#F15BB5" stroke-width="1" opacity="0.6"/>
</svg>