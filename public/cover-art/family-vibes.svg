<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="family-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F15BB5"/>
      <stop offset="50%" style="stop-color:#9B5DE5"/>
      <stop offset="100%" style="stop-color:#00BBF9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="300" height="200" fill="#1a1a1e"/>
  <rect width="300" height="200" fill="url(#family-gradient)" opacity="0.2"/>
  
  <!-- Heart symbols representing family -->
  <text x="80" y="70" text-anchor="middle" fill="#F15BB5" font-family="Arial" font-size="24" filter="url(#glow)">💜</text>
  <text x="130" y="80" text-anchor="middle" fill="#9B5DE5" font-family="Arial" font-size="28" filter="url(#glow)">💙</text>
  <text x="170" y="75" text-anchor="middle" fill="#00BBF9" font-family="Arial" font-size="26" filter="url(#glow)">💗</text>
  <text x="220" y="85" text-anchor="middle" fill="#F15BB5" font-family="Arial" font-size="22" filter="url(#glow)">🤍</text>
  
  <!-- Connecting lines between hearts -->
  <path d="M 90 75 Q 110 65 120 80" stroke="#9B5DE5" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>
  <path d="M 140 85 Q 155 70 160 80" stroke="#F15BB5" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>
  <path d="M 180 80 Q 200 75 210 85" stroke="#00BBF9" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Central title -->
  <text x="150" y="125" text-anchor="middle" fill="white" font-family="Montserrat, sans-serif" font-size="26" font-weight="bold" filter="url(#glow)">FAMILY</text>
  <text x="150" y="145" text-anchor="middle" fill="#F15BB5" font-family="Montserrat, sans-serif" font-size="26" font-weight="bold" filter="url(#glow)">VIBES</text>
  <text x="150" y="165" text-anchor="middle" fill="#9B5DE5" font-family="Montserrat, sans-serif" font-size="12" font-weight="600">R&amp;B / POP</text>
  
  <!-- Warm glow at bottom -->
  <ellipse cx="150" cy="190" rx="100" ry="10" fill="url(#family-gradient)" opacity="0.4" filter="url(#glow)"/>
</svg>