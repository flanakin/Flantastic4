<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ifly-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B5DE5"/>
      <stop offset="50%" style="stop-color:#F15BB5"/>
      <stop offset="100%" style="stop-color:#00BBF9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="300" height="200" fill="url(#ifly-gradient)" opacity="0.8"/>
  <rect width="300" height="200" fill="url(#ifly-gradient)" opacity="0.3"/>
  
  <!-- Flying elements -->
  <circle cx="80" cy="60" r="3" fill="#00BBF9" filter="url(#glow)" opacity="0.9">
    <animate attributeName="cy" values="60;40;60" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="80" r="2" fill="#F15BB5" filter="url(#glow)" opacity="0.8">
    <animate attributeName="cy" values="80;50;80" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="70" r="4" fill="#9B5DE5" filter="url(#glow)" opacity="0.7">
    <animate attributeName="cy" values="70;45;70" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central title -->
  <text x="150" y="120" text-anchor="middle" fill="white" font-family="Montserrat, sans-serif" font-size="32" font-weight="bold" filter="url(#glow)">I FLY</text>
  <text x="150" y="145" text-anchor="middle" fill="#00BBF9" font-family="Montserrat, sans-serif" font-size="14" font-weight="600">HIP HOP / AI-ENHANCED</text>
  
  <!-- Decorative lines -->
  <line x1="50" y1="160" x2="250" y2="160" stroke="#F15BB5" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <line x1="70" y1="170" x2="230" y2="170" stroke="#9B5DE5" stroke-width="1" opacity="0.4"/>
</svg>